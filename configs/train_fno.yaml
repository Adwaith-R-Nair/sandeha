# FNO training (docs/PLAN.md, Task 5). Batch size is confirmed by scripts/measure_throughput.py.
data_root: data
device: auto
seed: 0
model:
  arch: fno
  width: 48
  modes: 24
  layers: 4
batch_size: 16
num_workers: 2
lr: 3.0e-4
weight_decay: 0.01
lambda_div: 0.1
mixed_precision: true
warmup_fraction: 0.1 # Of all steps, before any pushforward.
pushforward_prob: 0.5
pushforward_max: 3
max_minutes: 40 # Sets the total steps from a speed measured at the start of the run.
timing_steps: 50
eval_every: 1000
checkpoint_every: 500
log_every: 50
rollout_start: 20 # The preregistered rollouts' start frame.
rollout_steps: 20
eval_batch_size: 16
