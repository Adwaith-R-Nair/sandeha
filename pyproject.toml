[project]
name = "sandeha"
version = "0.1.0"
description = "A neural smoke simulator that hands off to a physics solver when its own doubt is high."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "h5py>=3.16.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6",
    "torch>=2.14",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandeha"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
